name: jobseeker-ranking

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-jobseeker_test}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-jobseeker_test}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: applies migrations, then exits. `api` waits for it to succeed so the
  # schema is always ahead of the process that serves traffic.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api_env
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-jobseeker_test}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_RANKING_TTL_SECONDS: ${REDIS_RANKING_TTL_SECONDS:-60}
      REDIS_CRITERIA_TTL_SECONDS: ${REDIS_CRITERIA_TTL_SECONDS:-300}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080,http://localhost:5173}
    command:
      [
        'node',
        './node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'apps/api/dist/database/data-source.js',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Opt-in: `docker compose --profile seed run --rm seed`
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['seed']
    environment: *api_env
    command: ['node', 'apps/api/dist/database/seed.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api_env
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/vacancies').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
